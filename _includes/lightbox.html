  <dialog class="lightbox" aria-label="Meme viewer">
    <figure class="lightbox-figure">
      <img class="lightbox-img" src="" alt="">
      <figcaption class="lightbox-caption" aria-live="polite"></figcaption>
    </figure>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous meme"><svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg></button>
    <button class="lb-btn lb-next" type="button" aria-label="Next meme"><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
    <button class="lb-btn lb-close" type="button" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  </dialog>
