<!doctype html>
<html lang="hi-Latn" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141416">
  {% seo %}
  {% feed_meta %}

  <!-- Icons -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <script src="{{ '/script.js' | relative_url }}" defer></script>
</head>
<body>
  <!-- Icon sprite (simple outline icons, drawn for this site) -->
{% include icons.html %}
{% include header.html %}
  <main id="main">
{{ content }}
  </main>

{% include footer.html %}
{% if page.lightbox %}
{% include lightbox.html %}
{% endif %}
</body>
</html>
